        <script>
            // Gate the engine on a verified account. Without a session the
            // join endpoint always refuses, so send the user back to the
            // login screen instead of showing a dead loading screen.
            (function () {
                try {
                    var s = window.__RBX_SESSION || {};
                    var q = new URLSearchParams(location.search);
                    if (q.has("guest")) return;
                    var saved = "";
                    try { saved = localStorage.getItem("robloxweb.cookie") || ""; } catch (e) {}
                    // A cookie on the server counts too: it may still be
                    // validating, and bouncing back to the login screen would
                    // loop. Only send the user away when there is no session at
                    // all.
                    if (!s.authenticated && !s.cookie && !saved) location.replace("./index.html");
                } catch (e) {}
            })();
        </script>

                // must not (and cannot) send credentials of its own.

                          '<pre style="margin:0 0 16px;background:#0b0e14;border:1px solid #2a3140;border-radius:8px;padding:12px 14px;font-size:12.5px;color:#9ff0c4;overflow:auto">cd "RobloxWeb-modded copy 2"\n./start.sh</pre>' +
                          '<p style="margin:0;color:#8f9aad;font-size:12.5px">Then open <b style="color:#cfd6e4">http://localhost:3000/</b> \u2014 not a <code>file://</code> URL and not another port.</p>' +
                        '</div>';
                    (document.body || document.documentElement).appendChild(wrap);
                }

                function probeBackend() {
                    // Two attempts: a single dropped connection (server just
                    // restarted, socket reset) must not be reported to the user
                    // as "the backend is not running".
                    function once() {
                        return fetch("/api/health", { cache: "no-store" })
                            .then(function (r) { return r.ok ? r.json() : null; })
                            .then(function (j) { return j && j.ok ? j : null; })
                            .catch(function () { return null; });
                    }
                    return once().then(function (health) {
                        if (health) return health;
                        return new Promise(function (res) { setTimeout(res, 400); }).then(once);
                    });
                }

                probeBackend().then(function (health) {
                    if (!health) { backendMissing(); return; }
                    if (health.buildId !== "2026-11-03-join-diagnostics") {
                        showBlocked(
                            "Restart the updated Roblox Web server",
                            "This page is updated, but the server process handling game requests is an older build.",
                            "Stop the running server with Ctrl+C, then run ./start.sh from the updated RobloxWeb folder and reload this page.",
                            "SERVER_BUILD_MISMATCH"
                        );
                        var mismatch = document.getElementById("rbx-preflight-block");
                        var details = mismatch && mismatch.querySelector("p");
                        if (details) {
                            details.textContent = "Page expects join-diagnostics; port " + (location.port || "80") +
                                " answered with " + (health.buildId || "an older server without a build ID") +
                                (health.root ? " from " + health.root : "") +
                                (health.pid ? " (PID " + health.pid + ")" : "") + ".";
                        }
                        return;
                    }
                    if (guest) { boot(); return; }
                    fetch("/api/auth/verify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    cache: "no-store",
                    body: JSON.stringify({ placeId: placeId })
                })
                    .then(function (r) { return r.json().catch(function () { return {}; }); })
                    .then(function (j) {
                        if (!j || !j.authenticated) {
                            showBlocked(
                                "Roblox does not recognise a session",
                                (j && j.error) || "No Roblox account is attached to this client.",
                                (j && j.remedy) || "Sign in on the login screen first.",
                                (j && j.code) || "NO_SESSION"
                            );
                            return;
                        }
                        annotateIdentity(j.identity);
                        var p = j.place || {};
                        var pf = p.preflight || {};
                        if (pf.unavailable) {
                            // join-game-metadata is gone (404). We cannot know
                            // the playability ahead of time, so boot and let the
                            // join itself decide; the error panel explains it.
                            console.warn("[preflight] playability preflight unavailable (endpoint retired)");
                        }
                        // A metadata/preflight result must not locally block a
                        // place. Attempt every numeric place and let the actual
                        // gamejoin response decide whether Roblox authorizes it.
                        if (pf.playabilityStatus && pf.playabilityStatus !== "Ok") {
                            console.warn("[preflight] Roblox reported " + pf.playabilityStatus + "; attempting the place anyway");
                        }
                        boot();
                    })
                    .catch(function (e) {
                        console.warn("[preflight] verify failed", e);
                        boot();
                    });
                });
            })();
        </script>
        <script>
            /*
              Turn the engine's opaque join failure into something actionable.

              When a join is refused the engine fills the loading screen's error
              panel with a generic line ("Not authorized to join this
              experience", "Error Code: 524") and a numeric status. Neither says
              *why*. The panel is static markup inside #__next, so we watch it
              for the moment React un-hides it, then ask the server to re-run
              the same authorization checks and append a one-line diagnosis:
              which account the session belongs to, which experience this is,
              what gamejoin says about it, and what to do next.

              Nothing is written until the panel is actually shown, so this can
              never disturb hydration.
            */
            (function () {
                "use strict";

                function wire() {
                var placeId = "";
                try { placeId = new URLSearchParams(location.search).get("placeId") || ""; } catch (e) {}

                var done = false;
                function enrich() {
                    if (done) return;
                    // Re-query every tick: React may replace the panel node
                    // during hydration, so a reference captured earlier can go
                    // stale and never report the change.
                    var p = document.querySelector(".loading-error-panel") ||
                        document.getElementById("loading-error-panel");
                    if (!p || p.hasAttribute("hidden")) return;
                    done = true;
                    fetch("/api/join/diagnose?placeId=" + encodeURIComponent(placeId), { cache: "no-store" })
                        .then(function (r) { return r.json(); })
                        .then(function (j) {
                            var bits = [];
                            if (j.identity) bits.push("signed in as @" + j.identity.name);
                            if (j.place && j.place.name) {
                                bits.push(j.place.name + (j.place.creator && j.place.creator.name ? " by " + j.place.creator.name : ""));
                            }
                            if (j.place && j.place.ownedByYou === false) {
                                var creatorType = String(j.place.creator && j.place.creator.type || "").toLowerCase();
                                if (creatorType === "group") {
                                    bits.push("Web Play access: group owner, editor, early tester, or play tester");
                                } else if (creatorType === "user") {
                                    bits.push("Web Play beta: individually owned games are owner-only");
                                } else {
                                    bits.push("this game is not owned by the signed-in account; check Web Play tester access");
                                }
                            }
                            if (j.engineRequest) {
                                var x = j.engineRequest;
                                var initial = x.initial || {};
                                var finalResult = x.final || {};
                                var requestLine = "proxy request: cookie " + (x.cookieAttached ? "present" : "missing") +
                                    ", CSRF " + (x.csrfAttached ? "present" : "missing") +
                                    ", Roblox status " + (initial.robloxStatus == null ? "unknown" : initial.robloxStatus);
                                if (x.sessionRefreshHttpStatus != null) {
                                    requestLine += "; session refresh HTTP " + x.sessionRefreshHttpStatus +
                                        (x.sessionCookieRotated ? " (cookie updated)" : "");
                                }
                                if (x.csrfCookieAligned != null) {
                                    requestLine += x.csrfCookieAligned ? "; session/token aligned" : "; session/token alignment unknown or mismatched";
                                }
                                if (x.retries && x.retries.length) {
                                    var lastRetry = x.retries[x.retries.length - 1];
                                    requestLine += "; " + lastRetry.cookieSource + " retry returned " +
                                        (lastRetry.response.robloxStatus == null ? "HTTP " + lastRetry.response.httpStatus : "status " + lastRetry.response.robloxStatus);
                                } else if (x.browserRefreshSucceeded === false) {
                                    requestLine += "; browser session refresh failed";
                                }
                                if (finalResult.joinScriptIssued) requestLine += "; Roblox issued a join ticket";
                                bits.push(requestLine);
                            }
                            if (j.join && j.join.playabilityStatus) bits.push("playability " + j.join.playabilityStatus);
                            if (j.verdict && j.verdict !== "OK") bits.push("diagnosis " + j.verdict);
                            var line = bits.join(" \u00b7 ");
                            if (j.remedy) line += (line ? " \u2014 " : "") + j.remedy;
                            if (!line) return;

                            /*
                             * Render into our own node appended to <body>, not
                             * into the engine's panel: the LoadingScreen is a
                             * React component and re-renders on the second
                             * failure (gui-service), which would wipe anything
                             * we wrote inside its subtree.
                             */
                            var card = document.getElementById("rbx-join-diagnosis");
                            if (!card) {
                                card = document.createElement("div");
                                card.id = "rbx-join-diagnosis";
                                card.setAttribute("role", "status");
                                card.style.cssText = [
                                    "position:fixed", "left:50%", "bottom:24px",
                                    "transform:translateX(-50%)", "z-index:2147483646",
                                    "max-width:min(560px,calc(100vw - 32px))",
                                    "background:#161a23", "border:1px solid #2a3140",
                                    "border-radius:12px", "padding:14px 16px",
                                    "box-shadow:0 18px 48px rgba(0,0,0,.55)",
                                    "font-family:system-ui,-apple-system,'Segoe UI',sans-serif",
                                    "font-size:12.5px", "line-height:1.6", "color:#aab4c6",
                                ].join(";");
                                (document.body || document.documentElement).appendChild(card);
                            }
                            card.innerHTML = "";
                            var head = document.createElement("div");
                            head.textContent = "Join diagnosis";
                            head.style.cssText = "font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8f9aad;font-weight:700;margin-bottom:6px";
                            var bodyEl = document.createElement("div");
                            bodyEl.textContent = line;
                            bodyEl.style.cssText = "color:#cfd6e4";
                            card.appendChild(head);
                            card.appendChild(bodyEl);
                        })
                        .catch(function () {});
                }

                // Poll rather than observe: the panel's visibility is toggled by
                // the engine's React tree, and a MutationObserver bound to a
                // node that hydration later replaces never fires. 250ms for
                // three minutes costs nothing and always sees the final state.
                var ticks = 0;
                var timer = setInterval(function () {
                    enrich();
                    if (done || ++ticks > 720) clearInterval(timer);
                }, 250);
                enrich();
                // Backstop for background tabs, where setInterval is throttled
                // hard: watch the whole document for any `hidden` change.
                try {
                    new MutationObserver(enrich).observe(document.documentElement, {
                        attributes: true,
                        subtree: true,
                        attributeFilter: ["hidden"],
                    });
                } catch (e) {}
                console.log("[diagnose] join-failure watcher armed");
                }

                // This script sits in <head>, where the body (and therefore the
                // error panel) does not exist yet.
                if (document.readyState === "loading") {
                    document.addEventListener("DOMContentLoaded", wire, { once: true });
                } else {
                    wire();
                }
            })();
        </script>
